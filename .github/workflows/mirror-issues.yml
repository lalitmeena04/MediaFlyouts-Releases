name: Sync issues with main repo

on:
  issues:
    types:
      - opened
      - edited
      - deleted
      - closed
      - reopened
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - milestoned
      - demilestoned
      - locked
      - unlocked
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync script
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # The GitHub App must be installed on both repos with Issues read/write.
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},${{ vars.MAIN_REPO }}

      - name: Sync
        uses: actions/github-script@v7
        env:
          SIDE: public
          PEER_REPO: ${{ vars.MAIN_REPO }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const sync = require('./.github/scripts/sync-issue.js');
            await sync({ github, context, core });
